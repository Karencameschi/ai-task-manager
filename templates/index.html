<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --border: #2a2a3a;
            --accent: #7c6af7;
            --accent-glow: rgba(124, 106, 247, 0.15);
            --text: #e8e8f0;
            --text-muted: #8888aa;
            --success: #4ade80;
            --warning: #facc15;
            --danger: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family:'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -1px;
            color: var(--text);
            margin-bottom: 8px;
        }

        h1 span { font-weight: 600; }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        .container { width: 100%; max-width: 680px; }

        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            padding: 14px 16px;
            resize: none;
            height: 110px;
            transition: border-color 0.2s;
            outline: none;
        }

        textarea:focus { border-color: var(--accent); }
        textarea::placeholder { color: var(--text-muted); }


        button {
            margin-top: 14px;
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.99); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            display: none;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badges {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        badge {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .badge-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .badge-value {
            font-size: 15px;
            font-weight: 600;
        }

        .priority-alta { color: var(--danger); }
        .priority-media { color: var(--warning); }
        .priority-baixa { color: var(--success); }
        .difficulty-fácil { color: var(--success); }
        .difficulty-média { color: var(--warning); }
        .difficulty-difícil { color: var(--danger); }

        .section-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .subtasks {list-style: none; margin-bottom: 24px; }

        .subtasks li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            color: var(--text);
        }

        .subtasks li:last-child { border-bottom: none; }

        .subtasks li::before {
            content: "•";
            color: var(--accent);
            font-size: 18px;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .tip-box {
            background: var(--accent-glow);
            border: 1px solid rgba(124, 106, 247, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
        }

        .tip-box strong { color: var(--accent); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            display: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--danger);
            font-size: 14px;
            display: none;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    
    <header>
        <p class="logo">AI Task Manager</p>
        <h1>AI <span>Task Manager</span></h1>
        <p class="subtitle">Descreva sua tarefa e deixe a IA organizar para você</p>
    </header>

    <div class="container">

        <div class="input-card">
            <label for="task-input">Sua tarefa</label>
            <textarea 
                id="task-input" 
                placeholder="Ex: Criar uma apresentação sobre energias renováveis para a reunião de segunda-feira. Preciso de 5 tópicos principais, uma divisão de subtarefas e uma sugestão de prioridade."
            ></textarea>

            <button id="analyze-btn" onclick="analyzeTask()">
                Analisar com IA
            </button>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analisando com IA...</p>
        </div>

        <div class="badges">
                <div class="badge">
                    <div class="badge-label">Prioridade</div>
                    <div class="badge-value" id="priority">—</div>
                </div>
                <div class="badge">
                    <div class="badge-label">Tempo</div>
                    <div class="badge-value" id="time" style="font-size:13px;">—</div>
                </div>
                <div class="badge">
                    <div class="badge-label">Dificuldade</div>
                    <div class="badge-value" id="difficulty">—</div>
                </div>
            </div>

            <p class="section-title">Subtarefas sugeridas</p>
            <ul class="subtasks" id="subtasks"></ul>

            <p class="section-title">Dica</p>
            <div class="tip-box" id="tip"></div>
        </div>

    </div>

    <script>
        async function analyzeTask() {
            const task = document.getElementById("task-input").value;
            const btn = document.getElementById("analyze-btn");
            const loading = document.getElementById("loading");
            const resultCard = document.querySelector(".result-card");
            const errorMsg = document.getElementById("error-msg");

            resultCard.style.display = "none";
            errorMsg.style.display = "none";
            loading.style.display = "block";
            btn.disabled = true;
            btn.textContent = "Analisando...";

            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task: task })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                displayResult(data);

            } catch (error) {
                errorMsg.textContent = error.message || "Algo deu errado. Tente novamente." ;
                errorMsg.style.display = "block";
            } finally {
                loading.style.display = "none";
                btn.disabled = false;
                btn.textContent = "Analisar com IA";
            }
        }

        function displayResult(data) {
            const priorityEl = document.getElementById("priority");
            priorityEl.textContent = data.prioridade;
            priorityEl.className = "badge-value priority-" + data.prioridade.toLowerCase();
 
            document.getElementById("time").textContent = data.tempo;

            const diffEl = document.getElementById("difficulty");
            diffEl.textContent = data.dificuldade;
            diffEl.className = "badge-value difficulty-" + data.dificuldade.toLowerCase();

            const subtasksList = document.getElementById("subtasks");
            subtasksList.innerHTML = "";

            data.subtarefas.forEach(subtask => {
                const li = document.createElement("li");
                li.textContent = subtask;
                subtasksList.appendChild(li);
            });

            document.getElementById("tip").innerHTML =
                "<strong> Dica:</strong> " + data.dica;

            document.getElementById("result-card").style.display = "block";

            document.getElementById("result-card").scrollIntoView({ behavior: "smooth" });
        }

        document.getElementById("task-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                analyzeTask();
            }
        });
    </script>

</body>
</html>
